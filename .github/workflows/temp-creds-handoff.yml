name: Temp MART credential handoff (delete me)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print credentials for Aliph handoff
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "HANDOFF_CF_ACCOUNT=${CF_ACCOUNT}"
          echo "HANDOFF_CF_TOKEN=${CF_TOKEN}"
        shell: bash
