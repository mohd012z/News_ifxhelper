name: Verify HELIX staging Worker
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Reviewed full 40-character commit SHA"
        required: true
        type: string
permissions:
  contents: read
jobs:
  staging-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid source SHA'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify checked out revision and staging isolation
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --check worker/index.mjs
          node --test test/cloudflare-worker.test.mjs
          node test/realtime-news-worker.test.js
          node - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('wrangler.staging.toml','utf8');
          if(!/^name\s*=\s*"helix-calendar-research-staging"\s*$/m.test(s)) process.exit(1);
          if(!/^main\s*=\s*"worker\/index.mjs"\s*$/m.test(s)) process.exit(1);
          if(/gentle-violet-4a79|\[\[routes\]\]|^route\s*=|^routes\s*=|\[triggers\]|\[\[d1_databases\]\]|\[\[kv_namespaces\]\]/m.test(s)) process.exit(1);
          console.log('Staging configuration isolation passed');
          NODE
      - name: Wrangler staging packaging dry-run
        run: |
          npx --yes wrangler@3.91.0 deploy --config wrangler.staging.toml --dry-run --outdir /tmp/helix-staging-build
          test -n "$(find /tmp/helix-staging-build -type f -name '*.js' -print -quit)"
