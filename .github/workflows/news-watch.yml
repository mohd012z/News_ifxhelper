name: News watch (frequent, evidence refresh)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch news + calendar
        run: node build-news.js
      - name: Refresh macro KPIs
        run: node build-macro.js
      - name: Build freshness/version manifest
        run: node build-data-manifest.js
      - name: Run evidence-engine tests
        run: npm test
      - name: Send Telegram alerts for anything new
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node telegram-notify.js
      - name: Commit refreshed datasets + manifest + state
        run: |
          git config user.name "xau-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-auto.js macro-auto.js data-manifest.json .news-alert-state.json price-track.json
          git diff --cached --quiet || git commit -m "bot: refresh evidence + manifest [skip ci]"
          git push
