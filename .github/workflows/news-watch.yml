name: News watch (frequent, evidence refresh)

on:
  push:
    branches:
      - main
    paths:
      - "build-news.js"
      - "build-macro.js"
      - "build-data-manifest.js"
      - "shared-market-logic.js"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - ".github/workflows/news-watch.yml"
  schedule:
    - cron: "7,37 * * * *" # every 30 min, offset from busy :00/:30 scheduler windows
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data-writer
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch news + calendar
        run: node build-news.js
      - name: Refresh macro KPIs
        run: node build-macro.js
      - name: Build freshness/version manifest
        run: node build-data-manifest.js
      - name: Run evidence-engine tests
        run: npm test

      - name: Publish refreshed datasets before notifications
        run: |
          git config user.name "xau-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-auto.js macro-auto.js data-manifest.json price-track.json data/history
          if ! git diff --cached --quiet; then
            git commit -m "bot: refresh evidence + manifest [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Send Telegram alerts for anything new
        continue-on-error: true
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node telegram-notify.js
      - name: Send BBMA Alert to Channel
        continue-on-error: true
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || secrets.TELEGRAM_CHAT_ID }}
        run: node send-bbma-telegram.js

      - name: Persist notification state
        if: always()
        run: |
          git config user.name "xau-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .news-alert-state.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: update notification state [skip ci]"
            git pull --rebase origin main
            git push
          fi
