name: Daily digest (morning briefing + evening recap + weekly outlook)

# Three Telegram digests, separate from the per-item alerts in news-watch.yml:
#   - 08:00 MYT (00:00 UTC), every day: morning briefing - sent as TWO messages (summary, then
#     predictions), right after daily-refresh.yml's data refresh so it reads fresh data.
#   - 23:00 MYT (15:00 UTC), every day: evening recap - only what was actually published/
#     scheduled today, using each headline's real MYT timestamp.
#   - 08:10 MYT (00:10 UTC), Mondays only: weekly outlook - one message per high-impact event in
#     ForexFactory's "this week" window (the widest free scope that feed offers - confirmed no
#     free monthly/next-week variant exists), each with related commentary collected so far and a
#     hawkish/dovish research verdict, not just the bare forecast.

on:
  schedule:
    - cron: "27 0 * * *" # 00:27 UTC = 08:27 MYT; after the offset daily refresh
    - cron: "17 15 * * *" # 15:17 UTC = 23:17 MYT daily; avoids top-of-hour load
    - cron: "31 0 * * 1" # 00:31 UTC Monday = 08:31 MYT Monday
  workflow_dispatch:
    inputs:
      mode:
        description: "Which digest to send"
        required: true
        default: "daily-summary"
        type: choice
        options:
          - daily-summary
          - evening-recap
          - weekly-outlook

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pick mode (schedule vs manual dispatch)
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flag=--${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "27 0 * * *" ]; then
            echo "flag=--daily-summary" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "31 0 * * 1" ]; then
            echo "flag=--weekly-outlook" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--evening-recap" >> "$GITHUB_OUTPUT"
          fi

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node telegram-notify.js ${{ steps.pick.outputs.flag }}
