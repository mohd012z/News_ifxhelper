name: Intelligence 360
on:
  push:
    branches: [main]
    paths:
      - "build-intelligence-360.js"
      - "lib/intelligence-*.js"
      - "lib/intelligence-orchestrator.js"
      - ".github/workflows/intelligence-360.yml"
  schedule:
    - cron: '7 * * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: node build-intelligence-360.js
      - run: node -e "const x=require('./data/intelligence-360.json');if(!x.generatedAt||!x.status)throw Error('invalid intelligence snapshot')"
      - name: Rebuild manifest with Intelligence 360 lineage
        run: node build-data-manifest.js
      - name: Validate manifest lineage inputs
        run: |
          node -e "const m=require('./data-manifest.json');const i=require('./data/intelligence-360.json');if(!m.generatedAt||!i.generationId)throw Error('missing manifest/intelligence lineage');console.log('manifest lineage inputs',i.generationId,m.lineage&&m.lineage.status);"
      - run: |
          if [ -z "$(git status --porcelain -- data/intelligence-360.json)" ]; then
            echo 'No Intelligence 360 snapshot change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/intelligence-360.json data-manifest.json
          git commit -m 'data: refresh intelligence 360'
          git pull --rebase origin main
          git push
