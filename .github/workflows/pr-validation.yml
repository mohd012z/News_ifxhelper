name: PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**.js"
      - "**.py"
      - "package.json"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Evidence tests
        run: npm run test:evidence
      - name: History tests
        run: npm run test:history
      - name: Technical tests
        run: npm run test:technical
      - name: Reaction tests
        run: npm run test:reaction
      - name: Timestamp tests
        run: npm run test:timestamps
      - name: Intelligence tests
        run: npm run test:intelligence
      - name: BBMA engine tests
        run: npm run test:bbma
      - name: BBMA dashboard tests
        run: npm run test:bbma-dashboard
      - name: Market provider tests
        run: npm run test:market-provider
      - name: OHLC backfill tests
        run: npm run test:ohlc-backfill
      - name: OHLC resampler tests
        run: npm run test:ohlc-resampler
      - name: News level history tests
        run: npm run test:news-level-history
      - name: BBMA learning tests
        run: npm run test:bbma-learning
      - name: Evidence envelope tests
        run: npm run test:evidence-envelope
      - name: Source health tests
        run: npm run test:source-health
      - name: Orchestrator tests
        run: npm run test:orchestrator
      - name: Learning store tests
        run: npm run test:learning-store
      - name: Syntax-check runtime/build scripts
        run: |
          node --check build-news.js
          node --check build-bbma-watch.js
          node --check build-bbma-learning.js
          node --check build-intelligence-360.js
          node --check build-agent-health.js
          node --check build-intelligence-aggregate.js
          node --check lib/history-store.js
          node --check lib/technical-context.js
          node --check lib/timestamps.js
          node --check lib/evidence-envelope.js
          node --check lib/source-health.js
          node --check lib/intelligence-orchestrator.js
          node --check lib/learning-store.js
      - name: Build data manifest
        run: node build-data-manifest.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python doctor foundation tests
        run: python -m unittest discover -s test/py -p 'test_*.py' -v
      - name: Python CLI syntax
        run: python -m py_compile tools/py/ifx.py tools/py/candles.py tools/py/learningcheck.py tools/py/lib/result.py tools/py/lib/timeframes.py tools/py/lib/io.py
