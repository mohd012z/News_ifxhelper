name: Learning and Agent Health
on:
  push:
    branches: [main]
    paths:
      - "build-bbma-watch.js"
      - "build-bbma-learning.js"
      - "build-agent-health.js"
      - "lib/bbma-*.js"
      - ".github/workflows/learning-health.yml"
  schedule:
    - cron: '37 1 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - name: Ensure BBMA watch snapshot exists
        env:
          BBMA_SYMBOL: GC=F
        run: |
          if [ ! -s data/bbma-watch.json ]; then
            echo "BBMA snapshot missing; rebuilding it before learning."
            node build-bbma-watch.js
          fi
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('data/bbma-watch.json'));if(!x.generatedAt||!x.symbol||!x.analysis)throw Error('invalid BBMA bootstrap snapshot');console.log('BBMA snapshot ready',x.symbol,x.generatedAt);"
      - run: node build-bbma-learning.js
      - run: node build-agent-health.js
      - run: node -e "for(const f of ['data/bbma-performance.json','data/agent-health.json'])JSON.parse(require('fs').readFileSync(f))"
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bbma-watch.json data/bbma-learning.json data/bbma-performance.json data/agent-health.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh learning and agent health'
          git pull --rebase origin main
          git push
