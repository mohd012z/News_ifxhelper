name: BBMA Candle Watch
on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bbma-candle-watch
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build BBMA watch snapshot
        env:
          BBMA_SYMBOL: GC=F
        run: node build-bbma-watch.js
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/bbma-watch.json; then echo 'No BBMA snapshot change'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bbma-watch.json
          git commit -m 'data: refresh BBMA candle watch'
          git push
