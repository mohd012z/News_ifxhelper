name: T30 staging verification
on:
  push:
    branches:
      - feature/cloudflare-t30-reminders
  pull_request:
    paths:
      - 'worker/**'
      - 'app.js'
      - 'test/calendar-frontend-freshness.test.js'
      - 'test/calendar-browser.test.cjs'
      - 'test/t30-reminder.test.mjs'
      - 'wrangler.toml'
      - 'migrations/**'
      - '.github/workflows/t30-staging-test.yml'
permissions:
  contents: read
jobs:
  t30:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static module checks
        run: |
          node --check worker/fundamental-cycle.mjs
          node --check test/fundamental-cycle.test.mjs
          node --check worker/fundamental-research.mjs
          node --check test/fundamental-research.test.mjs
          node --check worker/reminder.mjs
          node --check worker/index.mjs
          node --check app.js
          node --check test/calendar-frontend-freshness.test.js
          node --check test/t30-reminder.test.mjs
      - name: Run T30 regression suite
        run: |
          node test/calendar-frontend-freshness.test.js
          node test/t30-reminder.test.mjs
          node test/fundamental-research.test.mjs
          node test/fundamental-cycle.test.mjs

  browser-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser test dependency
        run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.58.2
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium DOM calendar regressions
        run: node test/calendar-browser.test.cjs
