name: Telegram identity and webhook probe (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only bot identity and webhook inspection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EXPECTED_USERNAME: news_ifxhelperbot
        run: node telegram/probe-bot.mjs
