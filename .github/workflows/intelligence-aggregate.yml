name: Intelligence Aggregates
on:
  schedule:
    - cron: '17 2 * * 1'
    - cron: '47 2 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: node build-intelligence-aggregate.js
      - run: node -e "for(const f of ['data/intelligence-weekly.json','data/intelligence-monthly.json'])JSON.parse(require('fs').readFileSync(f))"
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/intelligence-weekly.json data/intelligence-monthly.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh intelligence aggregates'
          git pull --rebase origin main
          git push
