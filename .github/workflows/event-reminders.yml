name: Event reminders (T-30 / T-10 / T-2)

# Five-minute redundancy path for the economic calendar.
# It refreshes only the current-week structured calendar slice, publishes only when provider
# content actually changes, then evaluates reminder windows. This keeps calendar freshness
# independent of the heavier news-watch schedule.

on:
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data-writer
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh durable current-week calendar slice
        run: node refresh-calendar-snapshot.js

      - name: Rebuild manifest after calendar heartbeat
        run: node build-data-manifest.js

      - name: Verify calendar heartbeat
        run: npm run test:calendar-heartbeat

      - name: Publish calendar changes before reminders
        run: |
          git config user.name "xau-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-auto.js data-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: calendar heartbeat refresh [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Check for events entering a reminder window
        continue-on-error: true
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node telegram-notify.js --reminders

      - name: Persist reminder state
        if: always()
        run: |
          git config user.name "xau-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .news-alert-state.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: reminder state update [skip ci]"
            git pull --rebase origin main
            git push
          fi
