name: Event reminders (T-30 / T-10)

# Five-minute redundancy path for the economic calendar.
# It refreshes only the current-week structured calendar slice, publishes only when provider
# content actually changes, then evaluates reminder windows. This keeps calendar freshness
# independent of the heavier news-watch schedule.

on:
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data-writer
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh durable current-week calendar slice
        id: heartbeat
        run: |
          set +e
          node refresh-calendar-snapshot.js
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Calendar heartbeat fetch failed; stale snapshot must not be treated as refreshed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit "$rc"
          elif git diff --quiet -- news-auto.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild manifest after calendar heartbeat
        if: steps.heartbeat.outputs.changed == 'true'
        run: node build-data-manifest.js

      - name: Verify calendar heartbeat
        run: npm run test:calendar-heartbeat

      - name: Publish calendar changes before reminders
        if: steps.heartbeat.outputs.changed == 'true'
        run: |
          git config user.name "xau-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-auto.js data-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: calendar heartbeat refresh [skip ci]"
            git pull --rebase origin main
            git push
          fi

      # Research branch: no Telegram delivery or reminder-state mutation.
      - name: Verify T-30 and T-10 policy without sending
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('telegram-notify.js','utf8'); if(!s.includes('const REMINDER_STAGES = [30, 10];')) process.exit(1); console.log('T-30/T-10 policy verified, delivery disabled')"
